<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Säg det bara! Test Runner</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    .log { margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>Säg det bara! Test Suite</h1>
  <div id="results"></div>

  <!-- Inkludera spelmoduler -->
  <script src="words.js"></script>
  <script src="audio.js"></script>

  <!-- Dummy DOM elements for app -->
  <div id="app" style="display:none;">
    <button id="header-sound-toggle"></button>
    <main id="view-settings"></main>
    <main id="view-ready"></main>
    <main id="view-game"></main>
    <main id="view-review"></main>
    <main id="view-scoreboard"></main>
    <main id="view-sudden-death"></main>
    <main id="view-victory"></main>

    <div id="team-list"></div>
    <button id="btn-add-team"></button>
    <div class="package-card active" data-package="standard"></div>
    <div class="package-card active" data-package="party"></div>
    <div class="package-card" data-package="familj"></div>
    <div class="package-card" data-package="klurigt"></div>

    <button id="btn-open-custom-words"></button>
    <span id="custom-words-count">0</span>
    <div id="custom-words-modal">
      <button id="btn-close-custom-modal"></button>
      <button id="btn-save-custom-modal"></button>
      <input id="input-custom-word">
      <button id="btn-add-custom-word"></button>
      <div id="custom-words-list"></div>
      <button id="btn-clear-all-custom"></button>
    </div>

    <button data-target-score="30"></button>
    <button data-target-score="50" class="active"></button>
    <button data-target-score="80"></button>
    <button data-round-time="30"></button>
    <button data-round-time="45"></button>
    <button data-round-time="60" class="active"></button>
    <button data-round-time="90"></button>

    <div class="toggle-row">
      <span class="desc"></span>
      <div id="toggle-penalty" class="toggle-switch active"></div>
    </div>
    <div class="toggle-row">
      <div id="toggle-sound" class="toggle-switch active"></div>
    </div>
    <button id="btn-start-game"></button>

    <div id="ready-team-badge"><span class="team-dot"></span><span></span></div>
    <div id="ready-team-name"></div>
    <div id="ready-round-num"></div>
    <div id="ready-team-score"></div>
    <button id="btn-begin-round"></button>

    <span id="game-team-dot"></span>
    <span id="game-team-name"></span>
    <div id="timer-number"></div>
    <div id="timer-bar-fill"></div>
    <div id="live-correct-count"></div>
    <div id="live-pass-count"></div>
    <div id="word-card">
      <div id="stamp-correct"></div>
      <div id="stamp-pass"></div>
      <span id="word-category"></span>
      <span id="word-text"></span>
    </div>
    <button id="btn-action-pass"></button>
    <button id="btn-action-correct"></button>
    <button id="btn-pause-game"></button>
    <div id="pause-overlay">
      <button id="btn-resume-game"></button>
      <button id="btn-finish-early"></button>
      <button id="btn-discard-round"></button>
    </div>

    <div id="review-team-name"></div>
    <div id="review-points-summary"></div>
    <div id="review-correct-count"></div>
    <div id="review-pass-count"></div>
    <div id="review-list"></div>
    <button id="btn-confirm-round"></button>

    <div id="scoreboard-list"></div>
    <div id="scoreboard-target-hint"></div>
    <button id="btn-next-round"></button>

    <div id="sudden-death-teams"></div>
    <button id="btn-start-sudden-death"></button>

    <div id="victory-team-name"></div>
    <div id="stat-winner-points"></div>
    <div id="stat-accuracy"></div>
    <div id="stat-total-correct"></div>
    <div id="stat-total-pass"></div>
    <button id="btn-play-again-same"></button>
    <button id="btn-play-new-game"></button>
    <canvas id="confetti-canvas"></canvas>
  </div>

  <script src="app.js"></script>

  <script>
    function assert(cond, msg) {
      const res = document.getElementById('results');
      const div = document.createElement('div');
      div.className = 'log ' + (cond ? 'pass' : 'fail');
      div.textContent = (cond ? '✓ PASS: ' : '✗ FAIL: ') + msg;
      res.appendChild(div);
      console.log((cond ? '[PASS] ' : '[FAIL] ') + msg);
      if (!cond) throw new Error(msg);
    }

    async function runTests() {
      console.log('Startar verifieringstester...');
      const app = window.aliasApp;

      // 1. Ordbas & paket
      assert(Array.isArray(app.allWords), 'allWords är en array');
      assert(app.allWords.length >= 250, 'Minst 250 ord laddade (totalt: ' + app.allWords.length + ')');
      assert(app.selectedPackages.has('standard') && app.selectedPackages.has('party'), 'Standard- och partypaket valda');

      // 2. Egna ord & XSS-sanering
      app.addCustomWord('  <script>alert("hack")</script>  ');
      assert(app.customWords.length === 1, 'Ett eget ord tillagt');
      assert(!app.customWords[0].includes('<script>'), 'XSS-taggar sanerade bort från egna ord');
      app.renderCustomWordsModal();

      // 3. Orddragning med egna ord
      app.resetWordPool();
      const hasCustomInPool = app.availableWords.some(w => w.category === 'Eget ord ⭐');
      assert(hasCustomInPool, 'Egna ord inkluderade i kortleken');

      // 4. Laghantering & XSS på lagnamn
      assert(app.teams.length >= 2, 'Minst 2 lag');
      app.addTeam();
      assert(app.teams.length === 3, 'Tredje lag tillagt');
      app.teams[0].name = '<b>Superlaget</b>';
      app.showScoreboardView();
      // Kontrollera att textContent användes och inte rå HTML
      const firstTeamNameEl = document.querySelector('.team-score-name span:nth-child(2)');
      assert(firstTeamNameEl && firstTeamNameEl.textContent === '<b>Superlaget</b>', 'Lagnamn säkert renderat med textContent');

      // 5. Match & Rundhantering
      app.startGame();
      assert(app.currentView === 'ready', 'Vyn är "ready" vid start');
      app.startRound();
      assert(app.currentView === 'game', 'Vyn är "game" under runda');

      // 6. Stoppa runda i förtid
      app.handleWordAction('correct');
      app.handleWordAction('correct');
      app.finishRoundEarly();
      assert(app.currentView === 'review', 'finishRoundEarly() tar oss till "review"');
      assert(app.roundWords.length >= 2, 'Orden som hunnits med finns i granskningen');

      // 7. Granskning och poängsparning
      app.confirmRoundScore();
      assert(app.teams[0].score >= 2, 'Poäng sparades för lag 1');

      // 8. Sudden Death vid oavgjort
      app.teams[0].score = 50;
      app.teams[1].score = 50;
      app.teams[2].score = 20;
      app.currentTeamIndex = 2; // Sista laget i omgången
      app.roundWords = [];
      app.confirmRoundScore(); // Avslutar omgången

      assert(app.isSuddenDeath === true, 'Sudden Death triggas vid oavgjort över målet!');
      assert(app.currentView === 'suddenDeath', 'Sudden Death-vyn visas');
      assert(app.suddenDeathTeams.length === 2, 'Två lag i Sudden Death');

      console.log('Alla tester lyckades!');
      const done = document.createElement('div');
      done.id = 'test-complete';
      done.textContent = 'ALL_TESTS_PASSED';
      document.body.appendChild(done);
    }

    window.addEventListener('load', () => {
      setTimeout(runTests, 100);
    });
  </script>
</body>
</html>
